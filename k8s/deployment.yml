
apiVersion: apps/v1
kind: Deployment

metadata:
  name: github-argocd-demo

spec:
  replicas: 4

  selector:
    matchLabels:
      app: github-argocd-demo

  template:
    metadata:
      labels:
        app: github-argocd-demo

    spec:
      containers:
        - name: web
          image: mohamedfawzy1/github-argocd-demo:2548c308fea6708d11a08e520543fbb352f21f1d

          ports:
            - containerPort: 80
