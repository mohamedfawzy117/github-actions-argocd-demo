
apiVersion: apps/v1
kind: Deployment

metadata:
  name: github-argocd-demo

spec:
  replicas: 4

  selector:
    matchLabels:
      app: github-argocd-demo

  template:
    metadata:
      labels:
        app: github-argocd-demo

    spec:
      containers:
        - name: web
          image: mohamedfawzy1/github-argocd-demo:ef382f0fcc32a9176512154e3e89b2101ef2ccb7

          ports:
            - containerPort: 80
