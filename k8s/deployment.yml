
apiVersion: apps/v1
kind: Deployment

metadata:
  name: github-argocd-demo

spec:
  replicas: 4

  selector:
    matchLabels:
      app: github-argocd-demo

  template:
    metadata:
      labels:
        app: github-argocd-demo

    spec:
      containers:
        - name: web
          image: mohamedfawzy1/github-argocd-demo:45ec552e0d71c1d34a1992fdff8c1856b4b270b5

          ports:
            - containerPort: 80
